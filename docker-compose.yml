# CyberGuardian Node — infraestrutura local
#
# Sobe a infraestrutura de apoio. A APLICACAO (gateway, workers, sensor) roda
# por comando, fora do Docker — ver README.
#
# Uso:  docker compose up -d     |     docker compose down
#
# Organizacao do arquivo:
#   1. MENSAGERIA (R2)   — broker Kafka + criacao do topico
#   2. PERSISTENCIA      — bancos primario e replica (Etapa 7)

services:
  # ===========================================================================
  # 1. MENSAGERIA (R2)
  # ===========================================================================

  kafka:
    image: apache/kafka:4.0.0
    container_name: cyberguardian-kafka
    restart: unless-stopped

    ports:
      # Publica APENAS a porta externa: e por ela que o Node (no Windows) fala com o Kafka.
      # A 9092 nao e publicada de proposito — ela so faz sentido dentro da rede do Docker.
      - "29092:29092"

    environment:
      # --- Identidade do no no cluster (modo KRaft: o proprio Kafka se coordena) ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

      # --- Portas que o broker abre DENTRO do container ---
      KAFKA_LISTENERS: INTERNO://0.0.0.0:9092,EXTERNO://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNO:PLAINTEXT,EXTERNO:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNO

      # --- PONTO CRITICO: endereco que o broker ANUNCIA a cada cliente ---
      # Cliente que entrou pela porta interna recebe "kafka:9092" (nome na rede do Docker).
      # Cliente que entrou pela porta externa recebe "localhost:29092" (endereco valido no Windows).
      KAFKA_ADVERTISED_LISTENERS: INTERNO://kafka:9092,EXTERNO://localhost:29092

      # --- Cluster de 1 broker: nao existe outro no para onde replicar ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Sem espera artificial para formar o grupo de consumidores (acelera a demonstracao do R3)
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # --- Proibe criacao automatica de topico ---
      # Se ficasse ligado, um erro de digitacao no nome do topico criaria silenciosamente
      # um topico novo com 1 particao — e ai so 1 dos 3 workers receberia mensagens (quebra o R3).
      # E por isso que o servico "criar-topico" abaixo existe.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      # --- Onde o broker grava as mensagens (dentro do container, sem volume) ---
      # Decisao consciente: fila EFEMERA. "docker compose down" limpa a fila.
      # Persistencia de broker nao e exigida pelo escopo — o R6 trata de queda de
      # WORKER (resolvida por ack manual + offsets), nao de queda do broker.
      # Um volume nomeado aqui quebra por permissao (volume e root; Kafka roda como uid 1000).
      KAFKA_LOG_DIRS: /tmp/kafka-logs

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Criacao do topico — roda uma vez e encerra.
  #
  # Existe porque a auto-criacao de topicos esta DESLIGADA de proposito (acima).
  # Sem este servico, depois de um "docker compose down" o topico sumiria e o
  # gateway falharia ao publicar, exigindo um comando manual.
  #
  # Detalhes:
  #  - usa "kafka:9092" (listener INTERNO) porque roda DENTRO da rede do Docker;
  #  - "--if-not-exists" torna a operacao idempotente: subir de novo nao quebra;
  #  - o entrypoint da imagem sobe um broker, entao e sobrescrito por "sh -c"
  #    para executar apenas a ferramenta de topicos;
  #  - ao final faz um "--describe" para o LOG deste servico servir de evidencia.
  #
  # ATENCAO: o nome do topico aqui deve casar com TOPICO_ALERTAS em
  # src/compartilhado/kafka.ts, e as 3 particoes com o minimo de 3 workers (R3).
  # ---------------------------------------------------------------------------
  criar-topico:
    image: apache/kafka:4.0.0
    container_name: cyberguardian-criar-topico
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
        --create --if-not-exists
        --topic alertas-anomalia
        --partitions 3
        --replication-factor 1
        && echo "--- topico pronto ---"
        && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
        --describe --topic alertas-anomalia

  # ===========================================================================
  # 2. PERSISTENCIA (Etapa 7) — "A Memoria Intacta"
  # ===========================================================================
  # Dois bancos: PRIMARIO (autoritativo) e REPLICA.
  #
  # O schema e criado sozinho: a imagem oficial do Postgres executa qualquer
  # .sql em /docker-entrypoint-initdb.d/ na PRIMEIRA subida. Montando ./banco
  # ali nos dois containers, "docker compose up -d" ja entrega as tabelas
  # prontas — sem passo manual, do mesmo jeito que o topico do Kafka.

  postgres-primario:
    image: postgres:17-alpine
    container_name: cyberguardian-postgres-primario
    restart: unless-stopped

    ports:
      # 5432 = primario. A aplicacao roda fora do Docker e conecta por aqui.
      - "5432:5432"

    environment:
      POSTGRES_USER: cyberguardian
      POSTGRES_PASSWORD: cyberguardian
      POSTGRES_DB: cyberguardian

    volumes:
      # Scripts de banco exigidos pelo enunciado, aplicados automaticamente.
      - ./banco/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      # Prepara a streaming replication: papel "replicador" + pg_hba.
      - ./banco/replicacao/01-primario-replicacao.sh:/docker-entrypoint-initdb.d/02-replicacao.sh:ro
      # Volume nomeado: aqui a persistencia E o ponto da etapa. Diferente do
      # Kafka (fila efemera por decisao), o estado consolidado deve sobreviver.
      # A imagem do Postgres ajusta o dono do volume sozinho — nao ha o problema
      # de permissao que tivemos com o Kafka na Etapa 1.
      - dados-primario:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberguardian -d cyberguardian"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ---------------------------------------------------------------------------
  # REPLICA — standby por STREAMING REPLICATION do PostgreSQL.
  #
  # NAO roda initdb e NAO aplica o schema: e uma copia fisica do primario, feita
  # com pg_basebackup, que sobe em modo somente-leitura consumindo o WAL.
  # Por isso o entrypoint e substituido (ver banco/replicacao/).
  # ---------------------------------------------------------------------------
  postgres-replica:
    image: postgres:17-alpine
    container_name: cyberguardian-postgres-replica
    restart: unless-stopped

    depends_on:
      postgres-primario:
        condition: service_healthy

    ports:
      # 5433 no host para nao colidir com o primario.
      - "5433:5432"

    environment:
      POSTGRES_USER: cyberguardian
      POSTGRES_PASSWORD: cyberguardian
      POSTGRES_DB: cyberguardian
      PRIMARIO_HOST: postgres-primario
      PGPASSWORD_REPLICACAO: replicador

    volumes:
      - ./banco/replicacao:/replicacao:ro
      - dados-replica:/var/lib/postgresql/data

    # bash explicito: dispensa o bit de execucao, que o Windows nao preserva.
    entrypoint: ["/bin/bash", "/replicacao/02-entrypoint-replica.sh"]

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberguardian -d cyberguardian"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  dados-primario:
  dados-replica:
